# Supabase local development configuration.
# Run `supabase start` to launch the local stack (Postgres, Auth, Storage,
# Studio, Inbucket). All ports below are namespaced under 543xx so they don't
# clash with a system Postgres install on 5432.
#
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "trendoraa"

[api]
enabled = true
port = 54321
# Schemas exposed via PostgREST. `public` is mandatory for app tables; `graphql_public`
# enables the optional pg_graphql endpoint.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/api/auth/instagram/callback",
  "http://localhost:3000/(auth)/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true

[auth.sms]
enable_signup = false
enable_confirmations = false

# OAuth providers — populated when external auth is wired up.
[auth.external.facebook]
enabled = false
client_id = "env(INSTAGRAM_CLIENT_ID)"
secret = "env(INSTAGRAM_CLIENT_SECRET)"
redirect_uri = "env(INSTAGRAM_REDIRECT_URI)"

[edge_runtime]
enabled = false

[analytics]
enabled = false

[experimental]
orioledb_version = ""
